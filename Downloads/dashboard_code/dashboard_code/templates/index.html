<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <!-- Link to the CSS file -->
</head>
<body>
    <div class="Dashboard">
        <!-- Header (Time, Date, Welcome) -->
        <div class="Vector70"></div>
        <div class="time">19:30</div>
        <div class="date">07/09/2024</div>
        <div class="welcome">
            <img src="{{ url_for('static', filename='images/profile_image.png') }}" alt="Welcome Icon">
            <span>WELCOME ACCI</span>
        </div>

        <!-- Warning Section (Hidden initially) -->
        <div id="warning-section" class="warning" style="display: none;">
            <span class="warning-text">WARNING!</span>
            <span class="critical-temp">CRITICAL TEMPERATURE</span>
        </div>

        <!-- Battery Section -->
        <div class="battery-section">
            <img src="{{ url_for('static', filename='images/Ellipse 30.png') }}" alt="Ellipse 30" class="battery-img">
            <div id="battery-percentage" class="battery-percentage">0%</div>
            <div class="battery-label">Battery charge</div>
        </div>

        <!-- Speed Section -->
        <div id="speed-display" class="speed-display">0</div>
        <div class="speed-unit">KMPH</div>

        <!-- Additional Details (Brake Pressure, Avg. Speed) -->
        <div class="details">
            <div class="detail brake-pressure">
                <img src="{{ url_for('static', filename='images/speedometer.png') }}" alt="Brake Pressure Icon">
                <div id="brake-pressure" class="value">0BAR</div>
                <div class="label">BRAKE PRESSURE</div>
            </div>
            <div class="detail avg-speed">
                <img src="{{ url_for('static', filename='images/Group 28.png') }}" alt="Speedometer Icon">
                <div class="value">78 Kmph</div>
                <div class="label">Avg. Speed</div>
            </div>
        </div>

        <!-- Temperature Section -->
        <div class="temperature-section">
            <div id="temp-value" class="temp-value">0°C</div>
            <div class="temp-indicator">
                <img src="{{ url_for('static', filename='images/Charge.png') }}" alt="Charge Icon">
            </div>
        </div>
        <div class="Ready">READY</div>

        <!-- Road Image -->
        <div class="road-section">
            <img src="{{ url_for('static', filename='images/Road.png') }}" alt="Road Image">
        </div>

        <!-- Acceleracers Logo (Properly aligned) -->
        <div class="acceleracers-logo">
            <img src="{{ url_for('static', filename='images/acceleracers_logo.png') }}" alt="Acceleracers Logo">
        </div>

        <!-- Rectangles and Charge Section -->
        <div class="charge-logo">
            <img src="{{ url_for('static', filename='images/Charge.png') }}" alt="Charge Icon"> <!-- Charge icon always visible -->
        </div>
        <div class="rectangle-109" style="display: none;">
            <img src="{{ url_for('static', filename='images/Rectangle 109.png') }}" alt="Rectangle 109">
        </div>
        <div class="rectangle-115" style="display: none;">
            <img src="{{ url_for('static', filename='images/Rectangle 115.png') }}" alt="Rectangle 115">  
        </div>
        <div class="rectangle-116" style="display: none;">
            <img src="{{ url_for('static', filename='images/Rectangle 116.png') }}" alt="Rectangle 116">
        </div>
        <div class="rectangle-117" style="display: none;">
            <img src="{{ url_for('static', filename='images/Rectangle 117.png') }}" alt="Rectangle 117">
        </div>
    </div>

    <!-- JavaScript for Fetching Data from Flask -->
    <script>
        function updateDashboard(sensorData) {
            // Update Speed
            document.getElementById('speed-display').innerText = sensorData.speed.toFixed(2);
            // Update Battery Percentage
            document.getElementById('battery-percentage').innerText = sensorData.battery.toFixed(2) + '%';
            // Update Brake Pressure
            document.getElementById('brake-pressure').innerText = sensorData.brake_pressure.toFixed(2) + 'BAR';
            // Update Temperature
            document.getElementById('temp-value').innerText = sensorData.temperature.toFixed(1) + '°C';
            
            // Show warning if temperature > 49°C
            if (sensorData.temperature > 49) {
                document.getElementById('warning-section').style.display = 'flex';
            }

            // Display Rectangles based on temperature
            if (sensorData.temperature >= 15) {
                document.querySelector('.rectangle-109').style.display = 'block';
            }
            if (sensorData.temperature >= 28) {
                document.querySelector('.rectangle-115').style.display = 'block';
            }
            if (sensorData.temperature >= 34) {
                document.querySelector('.rectangle-116').style.display = 'block';
            }
            if (sensorData.temperature >= 43) {
                document.querySelector('.rectangle-117').style.display = 'block';
            }
        }

        function fetchSensorData() {
            fetch('/sensor-data')
                .then(response => response.json())
                .then(data => {
                    updateDashboard(data); // Update the dashboard with fetched data
                })
                .catch(error => console.error('Error fetching sensor data:', error));
        }

        // Fetch sensor data every 5 seconds
        setInterval(fetchSensorData, 5000);
    </script>
</body>
</html>
